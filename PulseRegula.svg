<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-labelledby="prTitle prDesc">
  <title id="prTitle">PulseRegula</title>
  <desc id="prDesc">PulseRegula — Regulatory Affairs and Quality Consulting logo: a rounded square containing a pulse line shaped into the letter P, next to the PulseRegula wordmark.</desc>
  <defs>
    <linearGradient id="prGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1465a8"/>
      <stop offset="1" stop-color="#0f4c81"/>
    </linearGradient>
  </defs>
  <!-- Mark -->
  <g>
    <rect x="12" y="20" width="120" height="120" rx="26" fill="url(#prGrad)"/>
    <path d="M14 82 h20 l7 -20 l12 40 l8 -24 h11"
          fill="none" stroke="#ffffff" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"
          transform="translate(30,2)"/>
  </g>
  <!-- Wordmark -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="700">
    <text x="156" y="100" fill="#0f4c81">Pulse</text>
    <text x="278" y="100" fill="#221c35">Regula</text>
  </g>
  <text x="158" y="128" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" letter-spacing="3.4" fill="#5a5f73">REGULATORY AFFAIRS &amp; QUALITY</text>
</svg>
